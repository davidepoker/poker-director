                                <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem', marginBottom: '2rem'}}>
                                    {standings.map((player, index) => {
                                        const position = index + 1;
                                        const prize = position <= payouts ? prizes[position - 1] : 0;
                                        const medal = position === 1 ? '🥇' : position === 2 ? '🥈' : position === 3 ? '🥉' : '';
                                        
                                        return (
                                            <div 
                                                key={player.id}
                                                style={{
                                                    background: position <= payouts ? 'linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 215, 0, 0.05) 100%)' : 'var(--bg-secondary)',
                                                    border: position <= payouts ? '2px solid var(--poker-gold)' : '1px solid var(--border-color)',
                                                    borderRadius: '12px',
                                                    padding: '1rem',
                                                    display: 'flex',
                                                    justifyContent: 'space-between',
                                                    alignItems: 'center'
                                                }}
                                            >
                                                <div style={{display: 'flex', alignItems: 'center', gap: '1rem', flex: 1}}>
                                                    <div style={{
                                                        minWidth: '50px',
                                                        fontSize: '1.5rem',
                                                        fontWeight: '700',
                                                        color: position <= 3 ? 'var(--poker-gold)' : 'var(--text-secondary)'
                                                    }}>
                                                        {medal || `${position}°`}
                                                    </div>
                                                    <div style={{flex: 1}}>
                                                        <div style={{
                                                            fontSize: '1.1rem',
                                                            fontWeight: '700',
                                                            color: position <= payouts ? 'var(--poker-gold)' : 'var(--text-primary)'
                                                        }}>
                                                            {player.name}
                                                        </div>
                                                        <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '0.25rem'}}>
                                                            {!player.eliminated ? `${player.chips.toLocaleString()} chips` : 'Eliminato'}
                                                        </div>
                                                    </div>
                                                </div>
                                                {prize > 0 && (
                                                    <div style={{
                                                        fontSize: '1.3rem',
                                                        fontWeight: '700',
                                                        color: 'var(--poker-gold)',
                                                        textAlign: 'right'
                                                    }}>
                                                        €{prize}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {activeTournament?.killerPoint > 0 && killerLeaderboard.length > 0 && (
                                    <>
                                        <h3 style={{color: '#ff6b6b', marginBottom: '1rem', fontSize: '1.3rem'}}>
                                            💀 Classifica Killer Points
                                        </h3>
                                        <div style={{
                                            marginBottom: '1rem',
                                            padding: '0.75rem',
                                            background: 'linear-gradient(135deg, rgba(220, 20, 60, 0.15) 0%, rgba(139, 0, 0, 0.15) 100%)',
                                            borderRadius: '8px',
                                            textAlign: 'center',
                                            border: '2px solid rgba(220, 20, 60, 0.5)'
                                        }}>
                                            <div style={{fontSize: '1.2rem', fontWeight: '700', color: '#ff6b6b'}}>
                                                Pool Totale Killer: €{killerPool}
                                            </div>
                                        </div>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                                            {killerLeaderboard.map((entry, index) => (
                                                <div 
                                                    key={entry.playerId}
                                                    style={{
                                                        background: 'var(--bg-secondary)',
                                                        border: '1px solid rgba(220, 20, 60, 0.3)',
                                                        borderRadius: '8px',
                                                        padding: '0.75rem 1rem',
                                                        display: 'flex',
                                                        justifyContent: 'space-between',
                                                        alignItems: 'center'
                                                    }}
                                                >
                                                    <div style={{display: 'flex', alignItems: 'center', gap: '1rem', flex: 1}}>
                                                        <div style={{
                                                            minWidth: '40px',
                                                            fontSize: '1.2rem',
                                                            fontWeight: '700',
                                                            color: index === 0 ? '#ff6b6b' : 'var(--text-secondary)'
                                                        }}>
                                                            #{index + 1}
                                                        </div>
                                                        <div style={{
                                                            flex: 1,
                                                            fontSize: '1rem',
                                                            fontWeight: '600',
                                                            color: 'var(--text-primary)'
                                                        }}>
                                                            {entry.playerName}
                                                        </div>
                                                    </div>
                                                    <div style={{display: 'flex', alignItems: 'center', gap: '1rem'}}>
                                                        <div style={{
                                                            fontSize: '1.1rem',
                                                            fontWeight: '700',
                                                            color: '#ff6b6b'
                                                        }}>
                                                            {entry.count} 💀
                                                        </div>
                                                        <div style={{
                                                            fontSize: '1.1rem',
                                                            fontWeight: '700',
                                                            color: 'var(--poker-gold)',
                                                            minWidth: '60px',
                                                            textAlign: 'right'
                                                        }}>
                                                            €{entry.prize}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}

                                <button 
                                    className="btn btn-primary" 
                                    onClick={closeModal}
                                    style={{width: '100%', marginTop: '2rem', padding: '1rem', fontSize: '1.1rem'}}
                                >
                                    ✅ Chiudi
                                </button>
                            </div>
                        </div>
                    );
                }

                if (modalType === 'adminAuth') {
                    return (
                        <div className="modal-overlay" onClick={closeModal}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{maxWidth: '400px'}}>
                                <h2 className="modal-title">🔐 Password Amministratore</h2>
                                <div className="form-group">
                                    <label className="form-label">Inserisci Password</label>
                                    <input
                                        type="password"
                                        className="form-input"
                                        placeholder="Password"
                                        id="adminPasswordInput"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                const password = e.target.value;
                                                if (selectAdminMode(password)) {
                                                    closeModal();
                                                } else {
                                                    alert('❌ Password errata!');
                                                    e.target.value = '';
                                                }
                                            }
                                        }}
                                        autoFocus
                                    />
                                </div>
                                <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '1.5rem'}}>
                                    💡 Password predefinita: <code>poker2025</code>
                                    <br/>
                                    Cambiala nel codice per maggiore sicurezza!
                                </div>
                                <div style={{display: 'flex', gap: '1rem'}}>
                                    <button className="btn btn-secondary" onClick={closeModal}>
                                        Annulla
                                    </button>
                                    <button 
                                        className="btn btn-primary" 
                                        style={{flex: 1}}
                                        onClick={() => {
                                            const password = document.getElementById('adminPasswordInput').value;
                                            if (selectAdminMode(password)) {
                                                closeModal();
                                            } else {
                                                alert('❌ Password errata!');
                                                document.getElementById('adminPasswordInput').value = '';
                                            }
                                        }}
                                    >
                                        🔓 Sblocca
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            // ═══════════════════════════════════════════════════════════════════
            // MAIN RETURN
            // ═══════════════════════════════════════════════════════════════════
            
            return (
                <div className="app-container">
                    {/* Modal Selezione Modalità */}
                    {showModeSelection && (
                        <div className="modal-overlay">
                            <div className="modal-content" style={{maxWidth: '400px', textAlign: 'center'}}>
                                <h2 className="modal-title">🎰 Seleziona Modalità</h2>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '1rem', marginTop: '2rem'}}>
                                    <button 
                                        className="btn btn-primary"
                                        style={{padding: '1.5rem', fontSize: '1.1rem'}}
                                        onClick={selectViewerMode}
                                    >
                                        📺 Solo Visualizzazione
                                        <div style={{fontSize: '0.85rem', opacity: 0.8, marginTop: '0.5rem'}}>
                                            Per TV - Vedi tutto, non puoi modificare
                                        </div>
                                    </button>
                                    <button 
                                        className="btn btn-secondary"
                                        style={{padding: '1.5rem', fontSize: '1.1rem'}}
                                        onClick={() => openModal('adminAuth')}
                                    >
                                        📱 Amministratore
                                        <div style={{fontSize: '0.85rem', opacity: 0.8, marginTop: '0.5rem'}}>
                                            Per Cellulare - Controllo completo (richiede password)
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="header">
                        <div className="logo">
                            🎰 Davide Poker Director
                            {!isAdminMode && <span style={{fontSize: '0.7rem', marginLeft: '0.5rem', color: 'var(--accent-blue)'}}>📺 Viewer</span>}
                            {isAdminMode && <span style={{fontSize: '0.7rem', marginLeft: '0.5rem', color: 'var(--accent-green)'}}>🔓 Admin</span>}
                        </div>
                        <div className="header-actions">
                            {isAdminMode && (
                                <button className="icon-btn" onClick={lockAdmin} title="Blocca (Viewer Mode)">
                                    🔒
                                </button>
                            )}
                            {!isAdminMode && (
                                <button className="icon-btn" onClick={() => openModal('adminAuth')} title="Sblocca (Admin Mode)">
                                    🔓
                                </button>
                            )}
                            {activeTournament ? (
                                <>
                                    <button className="icon-btn" onClick={exportTournament} title="Esporta">
                                        💾
                                    </button>
                                    <label className="icon-btn" title="Importa">
                                        📤
                                        <input
                                            type="file"
                                            accept=".json"
                                            style={{display: 'none'}}
                                            onChange={importTournament}
                                        />
                                    </label>
                                </>
                            ) : (
                                <label className="icon-btn" title="Importa Torneo">
                                    📤 Importa
                                    <input
                                        type="file"
                                        accept=".json"
                                        style={{display: 'none'}}
                                        onChange={importTournament}
                                    />
                                </label>
                            )}
                        </div>
                    </div>

                    {showSaveIndicator && (
                        <div className="save-indicator">
                            ✅ Sincronizzato
                        </div>
                    )}

                    {currentView === 'dashboard' && renderDashboard()}
                    {currentView === 'create' && renderCreateTournament()}
                    {currentView === 'timer' && renderTimer()}
                    {currentView === 'players' && renderPlayers()}
                    {currentView === 'tables' && renderTables()}

                    {renderModal()}

                    <div className="nav-bar">
                        <div className={`nav-item ${currentView === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentView('dashboard')}>
                            <div style={{fontSize: '1.5rem'}}>🏠</div>
                            <div style={{fontSize: '0.75rem'}}>Home</div>
                        </div>
                        {activeTournament && (
                            <>
                                <div className={`nav-item ${currentView === 'timer' ? 'active' : ''}`} onClick={() => setCurrentView('timer')}>
                                    <div style={{fontSize: '1.5rem'}}>⏱️</div>
                                    <div style={{fontSize: '0.75rem'}}>Timer</div>
                                </div>
                                <div className={`nav-item ${currentView === 'players' ? 'active' : ''}`} onClick={() => setCurrentView('players')}>
                                    <div style={{fontSize: '1.5rem'}}>👥</div>
                                    <div style={{fontSize: '0.75rem'}}>Giocatori</div>
                                </div>
                                <div className={`nav-item ${currentView === 'tables' ? 'active' : ''}`} onClick={() => setCurrentView('tables')}>
                                    <div style={{fontSize: '1.5rem'}}>🎲</div>
                                    <div style={{fontSize: '0.75rem'}}>Tavoli</div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // RENDER APP
        // ═══════════════════════════════════════════════════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PokerDirector />);
    </script>
</body>
</html>
