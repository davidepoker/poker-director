                                                className="btn btn-danger"
                                                style={{padding: '0.5rem 1rem', fontSize: '0.85rem'}}
                                                onClick={() => openModal('eliminate', player)}
                                            >
                                                ❌ Eliminato
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {eliminatedPlayers.length > 0 && (
                            <>
                                <h3 style={{marginBottom: '1rem', color: 'var(--accent-red)'}}>Giocatori Eliminati ({eliminatedPlayers.length})</h3>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem'}}>
                                    {eliminatedPlayers.map(player => {
                                        const elimination = eliminationHistory.find(e => e.playerId === player.id);
                                        return (
                                            <div key={player.id} className="player-item eliminated">
                                                <div>
                                                    <span className="player-name">{player.name}</span>
                                                    <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '0.25rem'}}>
                                                        Posizione: {elimination?.position}° | 
                                                        {elimination?.eliminatedBy && ` Eliminato da: ${elimination.eliminatedBy}`} |
                                                        {elimination?.timestamp && ` ${new Date(elimination.timestamp).toLocaleTimeString('it-IT')}`}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            const renderTables = () => {
                const activePlayers = players.filter(p => p.active && !p.eliminated);
                const numTables = Math.ceil(activePlayers.length / 9);
                const tables = Array.from({ length: numTables }, (_, i) => i + 1);

                return (
                    <div style={{padding: '2rem 1rem'}}>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem', flexWrap: 'wrap', gap: '1rem'}}>
                            <h1 className="section-title" style={{marginBottom: 0}}>🎲 Tavoli</h1>
                            <button className="btn btn-primary" onClick={balanceTables}>
                                ⚖️ Bilancia Tavoli
                            </button>
                        </div>
                        <div className="tables-grid">
                            {tables.map(tableNum => {
                                const tablePlayers = activePlayers.filter(p => p.table === tableNum);
                                const seats = Array.from({ length: 9 }, (_, i) => i + 1);

                                return (
                                    <div key={tableNum}>
                                        <div className="poker-table">
                                            <div className="table-number">T{tableNum}</div>
                                            <div className="table-seats">
                                                {seats.map(seatNum => {
                                                    const player = tablePlayers.find(p => p.seat === seatNum);
                                                    
                                                    if (player) {
                                                        return (
                                                            <div
                                                                key={seatNum}
                                                                className="table-seat"
                                                                draggable
                                                                onDragStart={(e) => handleDragStart(e, player)}
                                                                onDragOver={(e) => e.preventDefault()}
                                                                onDrop={(e) => handleDrop(e, tableNum, seatNum)}
                                                            >
                                                                <div className="seat-avatar">
                                                                    {player.name.split(' ').map(n => n[0]).join('')}
                                                                </div>
                                                                <div className="seat-name">{player.name.split(' ')[0]}</div>
                                                                <div className="seat-chips">{(player.chips / 1000).toFixed(0)}k</div>
                                                                {player.rebuys > 0 && (
                                                                    <div style={{fontSize: '0.6rem', color: 'var(--accent-blue)'}}>
                                                                        R:{player.rebuys}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    }

                                                    return (
                                                        <div
                                                            key={seatNum}
                                                            className="table-seat empty"
                                                            onDragOver={(e) => e.preventDefault()}
                                                            onDrop={(e) => handleDrop(e, tableNum, seatNum)}
                                                        >
                                                            <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)'}}>
                                                                #{seatNum}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <>
                    <header className="app-header">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', maxWidth: '1400px', margin: '0 auto'}}>
                            <div>
                                <div className="app-logo">DAVIDE POKER DIRECTOR</div>
                                <div className="logo-subtitle">Tournament Management</div>
                            </div>
                            <div style={{display: 'flex', gap: '0.5rem'}}>
                                <button 
                                    style={{width: '40px', height: '40px', background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '1.2rem', transition: 'all 0.3s'}}
                                    onClick={exportTournament}
                                    title="Esporta Torneo"
                                    onMouseOver={(e) => e.target.style.background = 'rgba(255,255,255,0.2)'}
                                    onMouseOut={(e) => e.target.style.background = 'rgba(255,255,255,0.1)'}
                                >
                                    💾
                                </button>
                                <button 
                                    style={{width: '40px', height: '40px', background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '1.2rem', transition: 'all 0.3s'}}
                                    onClick={() => fileInputRef.current.click()}
                                    title="Importa Torneo"
                                    onMouseOver={(e) => e.target.style.background = 'rgba(255,255,255,0.2)'}
                                    onMouseOut={(e) => e.target.style.background = 'rgba(255,255,255,0.1)'}
                                >
                                    📂
                                </button>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept=".json"
                                    style={{display: 'none'}}
                                    onChange={importTournament}
                                />
                            </div>
                        </div>
                    </header>

                    <div className="app-container">
                        {currentView === 'dashboard' && renderDashboard()}
                        {currentView === 'create' && renderCreateTournament()}
                        {currentView === 'timer' && renderTimer()}
                        {currentView === 'players' && renderPlayers()}
                        {currentView === 'tables' && renderTables()}
                    </div>

                    {showSaveIndicator && (
                        <div className="save-indicator">
                            ✅ Torneo salvato!
                        </div>
                    )}

                    <nav className="bottom-nav">
                        <div className={`nav-item ${currentView === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentView('dashboard')}>
                            <div className="nav-icon">🏠</div>
                            <div>Home</div>
                        </div>
                        <div className={`nav-item ${currentView === 'timer' ? 'active' : ''}`} onClick={() => setCurrentView('timer')}>
                            <div className="nav-icon">⏱️</div>
                            <div>Timer</div>
                        </div>
                        <div className={`nav-item ${currentView === 'players' ? 'active' : ''}`} onClick={() => setCurrentView('players')}>
                            <div className="nav-icon">👥</div>
                            <div>Giocatori</div>
                        </div>
                        <div className={`nav-item ${currentView === 'tables' ? 'active' : ''}`} onClick={() => setCurrentView('tables')}>
                            <div className="nav-icon">🎲</div>
                            <div>Tavoli</div>
                        </div>
                    </nav>

                    {showModal && modalType === 'templates' && (
                        <div className="modal-overlay" onClick={closeModal}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 className="modal-header">Template Salvati</h2>
                                {templates.length === 0 ? (
                                    <p style={{color: 'var(--text-secondary)', textAlign: 'center', padding: '2rem'}}>
                                        Nessun template
                                    </p>
                                ) : (
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                                        {templates.map(template => (
                                            <div key={template.id} style={{background: 'var(--dark-bg)', padding: '1rem', borderRadius: '8px'}}>
                                                <h4 style={{marginBottom: '0.5rem'}}>{template.name}</h4>
                                                <p style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '1rem'}}>
                                                    €{template.buyIn} | Stack: {template.stack.toLocaleString()} | Livelli: {template.blindStructure.length}
                                                </p>
                                                <div style={{display: 'flex', gap: '0.5rem'}}>
                                                    <button className="btn btn-primary" style={{flex: 1}} onClick={() => loadTemplate(template)}>
                                                        Carica
                                                    </button>
                                                    <button className="btn btn-secondary" onClick={() => deleteTemplate(template.id)}>
                                                        🗑️
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <div className="modal-actions">
                                    <button className="btn btn-secondary" onClick={closeModal}>Chiudi</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && modalType === 'editPlayer' && editingPlayer && (
                        <div className="modal-overlay" onClick={closeModal}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 className="modal-header">Modifica Giocatore</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const newName = e.target.elements.playerName.value;
                                    updatePlayerName(editingPlayer.id, newName);
                                }}>
                                    <div className="form-group">
                                        <label className="form-label">Nome</label>
                                        <input
                                            type="text"
                                            name="playerName"
                                            className="form-input"
                                            defaultValue={editingPlayer.name}
                                            required
                                        />
                                    </div>
                                    <div className="info-row">
                                        <span className="info-label">Chips:</span>
                                        <span className="info-value">{editingPlayer.chips.toLocaleString()}</span>
                                    </div>
                                    <div className="info-row">
                                        <span className="info-label">Rebuys:</span>
                                        <span className="info-value">{editingPlayer.rebuys}</span>
                                    </div>
                                    <div className="modal-actions">
                                        <button type="button" className="btn btn-secondary" onClick={closeModal}>
                                            Annulla
                                        </button>
                                        <button type="submit" className="btn btn-primary">
                                            Salva
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showModal && modalType === 'eliminate' && eliminatingPlayer && (
                        <div className="modal-overlay" onClick={closeModal}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 className="modal-header">Elimina Giocatore</h2>
                                <p style={{marginBottom: '1.5rem'}}>
                                    Chi ha eliminato <strong>{eliminatingPlayer.name}</strong>?
                                </p>
                                <div className="players-list">
                                    {players.filter(p => p.active && !p.eliminated && p.id !== eliminatingPlayer.id).map(player => (
                                        <div key={player.id} className="player-item">
                                            <span className="player-name">{player.name}</span>
                                            <button 
                                                className="btn btn-primary"
                                                onClick={() => eliminatePlayer(eliminatingPlayer.id, player.name)}
                                            >
                                                Seleziona
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-secondary" onClick={closeModal}>Annulla</button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
